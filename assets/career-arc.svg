<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="Career trajectory: QA Engineer to SDET to Senior SDET to Full-Stack Developer">
  <title>Career trajectory — QA Engineer, SDET, Senior SDET, Full-Stack Developer</title>

  <defs>
    <linearGradient id="arcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0a0d37"/>
    </linearGradient>

    <linearGradient id="arcLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e2a56"/>
      <stop offset="35%" stop-color="#16f2b3"/>
      <stop offset="72%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="nowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16f2b3"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="nowGlow">
      <stop offset="0%" stop-color="#16f2b3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#16f2b3" stop-opacity="0"/>
    </radialGradient>

    <pattern id="arcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#16f2b3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="arcClip">
      <rect x="0" y="0" width="900" height="180" rx="16"/>
    </clipPath>

    <path id="arcPath" d="M90 104 L810 104"/>
  </defs>

  <g clip-path="url(#arcClip)">
    <rect width="900" height="180" fill="url(#arcBg)"/>
    <rect width="900" height="180" fill="url(#arcGrid)"/>
    <circle cx="810" cy="104" r="120" fill="url(#nowGlow)"/>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="178.5" rx="16" fill="none" stroke="#1e2a56" stroke-width="1.5"/>

  <text x="28" y="32" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.8" fill="#6b76a0">CAREER TRAJECTORY</text>
  <text x="872" y="32" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#16f2b3">BREAKING &#8594; BUILDING</text>

  <!-- track -->
  <line x1="90" y1="104" x2="810" y2="104" stroke="#243158" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="104" x2="810" y2="104" stroke="url(#arcLine)" stroke-width="3" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" values="720;0;0" keyTimes="0;0.38;1" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- travelling pulse -->
  <circle r="4.5" fill="#ffffff" opacity="0.9">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.38;1" calcMode="linear">
      <mpath xlink:href="#arcPath" href="#arcPath"/>
    </animateMotion>
  </circle>

  <!-- stop 1 -->
  <g>
    <circle cx="90" cy="104" r="7" fill="#0b1020" stroke="#2f7f6b" stroke-width="2.5"/>
    <text x="90" y="80" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="14" font-weight="600" fill="#8b93b0">QA Engineer</text>
    <text x="90" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#4c5a86">Siskom Technologies</text>
  </g>

  <!-- stop 2 -->
  <g>
    <circle cx="330" cy="104" r="7" fill="#0b1020" stroke="#16f2b3" stroke-width="2.5"/>
    <text x="330" y="80" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="14" font-weight="600" fill="#c3cbe4">SDET</text>
    <text x="330" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#4c5a86">Dream11</text>
  </g>

  <!-- stop 3 -->
  <g>
    <circle cx="570" cy="104" r="7" fill="#0b1020" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="570" y="80" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="14" font-weight="600" fill="#c3cbe4">Senior SDET</text>
    <text x="570" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#4c5a86">Syngenta Group</text>
  </g>

  <!-- stop 4 : now -->
  <g>
    <circle cx="810" cy="104" r="10" fill="none" stroke="#16f2b3" stroke-opacity="0.5" stroke-width="1.5">
      <animate attributeName="r" values="10;22;10" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="104" r="9" fill="url(#nowGrad)"/>
    <text x="810" y="78" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="15" font-weight="700" fill="url(#nowGrad)">Full-Stack Developer</text>
    <text x="810" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#16f2b3">you are here</text>
  </g>

  <text x="450" y="164" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.6" fill="#4c5a86">every stop taught me a different way software fails</text>
</svg>
