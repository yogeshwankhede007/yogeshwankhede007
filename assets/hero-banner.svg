<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Yogesh Wankhede - Senior SDET, AI-Native Quality Engineering">
  <title>Yogesh Wankhede - Senior SDET | AI-Native Quality Engineering</title>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0d1224"/>
      <stop offset="100%" stop-color="#0a0d37"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16f2b3"/>
      <stop offset="45%" stop-color="#6ee7f9"/>
      <stop offset="78%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16f2b3"/>
      <stop offset="100%" stop-color="#16f2b3" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowTeal">
      <stop offset="0%" stop-color="#16f2b3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#16f2b3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#16f2b3" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="900" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="280" fill="url(#bgGrad)"/>
    <rect width="900" height="280" fill="url(#grid)"/>

    <circle cx="90" cy="30" r="170" fill="url(#glowTeal)">
      <animate attributeName="cy" values="30;70;30" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="250" r="190" fill="url(#glowViolet)">
      <animate attributeName="cx" values="760;690;760" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="300" r="150" fill="url(#glowPink)">
      <animate attributeName="r" values="150;185;150" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0.75" y="0.75" width="898.5" height="278.5" rx="18" fill="none" stroke="#1e2a56" stroke-width="1.5"/>

  <g>
    <rect x="44" y="36" width="342" height="28" rx="14" fill="#16f2b3" fill-opacity="0.09" stroke="#16f2b3" stroke-opacity="0.35"/>
    <circle cx="62" cy="50" r="4.5" fill="#16f2b3">
      <animate attributeName="fill-opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="76" y="54.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.3" fill="#16f2b3">SDET &#8594; FULL-STACK DEV &#183; PUNE, INDIA</text>
  </g>

  <text x="44" y="122" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="0.5" fill="url(#nameGrad)">YOGESH WANKHEDE</text>

  <text x="46" y="152" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="16.5" font-weight="600" fill="#c3cbe4">Full-Stack Developer<tspan fill="#4c5a86"> &#183; </tspan>React + Python<tspan fill="#4c5a86"> &#183; </tspan>Senior SDET Roots</text>

  <rect x="46" y="166" width="150" height="2" rx="1" fill="url(#ruleGrad)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5">
    <g opacity="0">
      <animate attributeName="opacity" values="1;0;0;0" keyTimes="0;0.25;0.5;0.75" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
      <text x="46" y="203"><tspan fill="#16f2b3">~ $ </tspan><tspan fill="#c3cbe4">I spent years breaking software. Now I build it.</tspan><tspan fill="#16f2b3">_<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.5;0.75" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
      <text x="46" y="203"><tspan fill="#16f2b3">~ $ </tspan><tspan fill="#c3cbe4">React on the front. Python on the back. AI in the loop.</tspan><tspan fill="#16f2b3">_<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.25;0.5;0.75" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
      <text x="46" y="203"><tspan fill="#16f2b3">~ $ </tspan><tspan fill="#c3cbe4">Code written by someone who knows how it fails.</tspan><tspan fill="#16f2b3">_<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.25;0.5;0.75" dur="14s" calcMode="discrete" repeatCount="indefinite"/>
      <text x="46" y="203"><tspan fill="#16f2b3">~ $ </tspan><tspan fill="#c3cbe4">Shipping features with enterprise-grade confidence.</tspan><tspan fill="#16f2b3">_<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>

  <text x="46" y="240" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="0.8" fill="#6b76a0">REACT<tspan fill="#2f3a63"> // </tspan>TYPESCRIPT<tspan fill="#2f3a63"> // </tspan>PYTHON<tspan fill="#2f3a63"> // </tspan>FASTAPI<tspan fill="#2f3a63"> // </tspan>CLOUD<tspan fill="#2f3a63"> // </tspan>AI AGENTS</text>

  <g>
    <rect x="612" y="52" width="244" height="182" rx="12" fill="#070a14" fill-opacity="0.72" stroke="#1e2a56"/>
    <circle cx="630" cy="70" r="4" fill="#ff5f56"/>
    <circle cx="644" cy="70" r="4" fill="#ffbd2e"/>
    <circle cx="658" cy="70" r="4" fill="#27c93f"/>
    <text x="842" y="74" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#4c5a86">ship-it.yml</text>
    <line x1="612" y1="86" x2="856" y2="86" stroke="#1e2a56"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.13;0.93;1" dur="8s" repeatCount="indefinite"/>
        <text x="630" y="112"><tspan fill="#16f2b3">&#10003;</tspan><tspan fill="#9aa5c8" dx="8">react + typescript</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.17;0.22;0.93;1" dur="8s" repeatCount="indefinite"/>
        <text x="630" y="136"><tspan fill="#16f2b3">&#10003;</tspan><tspan fill="#9aa5c8" dx="8">python + fastapi</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.31;0.93;1" dur="8s" repeatCount="indefinite"/>
        <text x="630" y="160"><tspan fill="#16f2b3">&#10003;</tspan><tspan fill="#9aa5c8" dx="8">tested by design</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.40;0.93;1" dur="8s" repeatCount="indefinite"/>
        <text x="630" y="184"><tspan fill="#16f2b3">&#10003;</tspan><tspan fill="#9aa5c8" dx="8">secure by default</tspan></text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.52;0.93;1" dur="8s" repeatCount="indefinite"/>
        <rect x="628" y="198" width="212" height="22" rx="6" fill="#16f2b3" fill-opacity="0.12"/>
        <text x="640" y="213" font-size="11" letter-spacing="1" fill="#16f2b3">BUILD &#183; TEST &#183; SHIP</text>
        <text x="828" y="213" text-anchor="end" font-size="11" fill="#16f2b3">100%</text>
      </g>
    </g>
  </g>
</svg>
