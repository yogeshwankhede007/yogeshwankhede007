<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 168" width="900" height="168" role="img" aria-label="Anyone can ship code that works. I ship code that keeps working.">
  <title>Anyone can ship code that works. I ship code that keeps working.</title>

  <defs>
    <linearGradient id="qBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0a0d37"/>
    </linearGradient>

    <linearGradient id="qAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16f2b3"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#ec4899"/>
      <animate attributeName="x1" values="0;-0.5;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="qGlow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="qClip">
      <rect x="0" y="0" width="900" height="168" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#qClip)">
    <rect width="900" height="168" fill="url(#qBg)"/>
    <circle cx="140" cy="150" r="150" fill="url(#qGlow)"/>
    <text x="34" y="150" font-family="Georgia,Times New Roman,serif" font-size="190" font-weight="700" fill="#16f2b3" fill-opacity="0.09">&#8220;</text>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="166.5" rx="16" fill="none" stroke="#1e2a56" stroke-width="1.5"/>

  <rect x="0" y="0" width="4" height="168" fill="url(#qAccent)"/>

  <text x="450" y="66" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="19" fill="#6b76a0">Anyone can ship code that works.</text>
  <text x="450" y="104" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="27" font-weight="700" fill="url(#qAccent)">I ship code that keeps working.</text>

  <line x1="378" y1="126" x2="522" y2="126" stroke="#1e2a56"/>
  <text x="450" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#4c5a86">YOGESH WANKHEDE</text>
</svg>
