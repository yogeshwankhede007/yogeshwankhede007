<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 208" width="900" height="208" role="img" aria-label="Engineering principles: Tests Shape Design, Built Observable, Secure by Default, Obsess Over Edges">
  <title>Engineering principles: Tests Shape Design, Built Observable, Secure by Default, Obsess Over Edges</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#0a0d37"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16f2b3" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#1e2a56"/>
      <stop offset="70%" stop-color="#1e2a56"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
      <animate attributeName="x1" values="0;1;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16f2b3"/><stop offset="55%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ec4899"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#16f2b3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="208" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="208" fill="url(#bg)"/>
    <rect width="900" height="208" fill="url(#grid)"/>
    <circle cx="108" cy="198" r="288" fill="url(#glow)">
      <animate attributeName="cx" values="108;36;108" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="206.5" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="4" fill="#16f2b3"><animate attributeName="fill-opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="44" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.8" fill="#c3cbe4">ENGINEERING PRINCIPLES</text>
  <text x="872" y="36" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.6" fill="#4c5a86">four rules, zero exceptions</text>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.125;1" dur="0.80s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.125;1" dur="0.80s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/><rect x="28.0" y="58" width="199.0" height="124" rx="12" fill="#070a14" fill-opacity="0.66" stroke="#1e2a56"/><rect x="46.0" y="74" width="34" height="34" rx="10" fill="#16f2b3" fill-opacity="0.10" stroke="#16f2b3" stroke-opacity="0.4"/><g transform="translate(53.0 81.0) scale(0.833)" fill="none" stroke="#16f2b3" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></g><text x="46.0" y="130" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ebff">Tests Shape Design</text><text x="46.0" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">Hard-to-test code is</text><text x="46.0" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">telling you something.</text><rect x="46.0" y="137" width="36" height="2" rx="1" fill="#16f2b3" fill-opacity="0.85"><animate attributeName="width" values="12;48;12" dur="3.2s" repeatCount="indefinite"/></rect></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.213;1" dur="0.89s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.213;1" dur="0.89s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/><rect x="243.0" y="58" width="199.0" height="124" rx="12" fill="#070a14" fill-opacity="0.66" stroke="#1e2a56"/><rect x="261.0" y="74" width="34" height="34" rx="10" fill="#6ee7f9" fill-opacity="0.10" stroke="#6ee7f9" stroke-opacity="0.4"/><g transform="translate(268.0 81.0) scale(0.833)" fill="none" stroke="#6ee7f9" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></g><text x="261.0" y="130" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ebff">Built Observable</text><text x="261.0" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">Logs, metrics, traces</text><text x="261.0" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">ship with the feature.</text><rect x="261.0" y="137" width="36" height="2" rx="1" fill="#6ee7f9" fill-opacity="0.85"><animate attributeName="width" values="12;48;12" dur="3.6s" repeatCount="indefinite"/></rect></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.286;1" dur="0.98s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.286;1" dur="0.98s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/><rect x="458.0" y="58" width="199.0" height="124" rx="12" fill="#070a14" fill-opacity="0.66" stroke="#1e2a56"/><rect x="476.0" y="74" width="34" height="34" rx="10" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.4"/><g transform="translate(483.0 81.0) scale(0.833)" fill="none" stroke="#a78bfa" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g><text x="476.0" y="130" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ebff">Secure by Default</text><text x="476.0" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">The safe path should</text><text x="476.0" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">be the easy path too.</text><rect x="476.0" y="137" width="36" height="2" rx="1" fill="#a78bfa" fill-opacity="0.85"><animate attributeName="width" values="12;48;12" dur="4.0s" repeatCount="indefinite"/></rect></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.346;1" dur="1.07s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 12;0 12;0 0" keyTimes="0;0.346;1" dur="1.07s" fill="freeze" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1"/><rect x="673.0" y="58" width="199.0" height="124" rx="12" fill="#070a14" fill-opacity="0.66" stroke="#1e2a56"/><rect x="691.0" y="74" width="34" height="34" rx="10" fill="#ec4899" fill-opacity="0.10" stroke="#ec4899" stroke-opacity="0.4"/><g transform="translate(698.0 81.0) scale(0.833)" fill="none" stroke="#ec4899" stroke-width="2.40" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></g><text x="691.0" y="130" font-family="Segoe UI,Helvetica Neue,Ubuntu,Arial,sans-serif" font-size="15" font-weight="700" fill="#e6ebff">Obsess Over Edges</text><text x="691.0" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">Automate the boring;</text><text x="691.0" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#8b93b0">bugs hide at the edge.</text><rect x="691.0" y="137" width="36" height="2" rx="1" fill="#ec4899" fill-opacity="0.85"><animate attributeName="width" values="12;48;12" dur="4.4s" repeatCount="indefinite"/></rect></g>
</svg>
